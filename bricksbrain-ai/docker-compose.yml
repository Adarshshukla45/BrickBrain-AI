version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: bricksbrain-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    container_name: bricksbrain-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app

  backend:
    build: ./backend
    container_name: bricksbrain-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - ai-service
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/bricksbrain
      - JWT_SECRET=change_this_to_a_long_random_secret
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: bricksbrain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo_data:
